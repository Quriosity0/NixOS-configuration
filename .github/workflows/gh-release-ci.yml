name: Unstable Release

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unstable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail

          NOW_STAMP=$(date -u +'%d_%m_%Y-%H_%M_%S')
          NOW_HUMAN=$(date -u +'%d %b. %Y')

          TAG_NAME="unstable-${NOW_STAMP}"
          RELEASE_NAME="unstable-${NOW_STAMP}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "human_date=${NOW_HUMAN}" >> "$GITHUB_OUTPUT"

          PREV_TAG=$(gh release list \
            --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("unstable-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')

          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build changelog link
        id: changelog
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          NEW_TAG="${{ steps.meta.outputs.tag_name }}"
          PREV_TAG="${{ steps.meta.outputs.prev_tag }}"

          if [ -n "$PREV_TAG" ]; then
            URL="https://github.com/${REPO}/compare/${PREV_TAG}...${NEW_TAG}"
          else
            URL="https://github.com/${REPO}/commits/${NEW_TAG}"
          fi

          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          # Unstable (${{ steps.meta.outputs.human_date }}) **USE WITH CAUTION**

          **Unstable releases called unstable because they can break everything. Make sure to backup your system before updating it**

          Full Changelog: [${{ steps.changelog.outputs.url }}](${{ steps.changelog.outputs.url }})
          EOF

      - name: Package config files
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp configuration.nix home.nix flake.nix flake.lock hardware-configuration.nix pkg/
          cp -r modules pkg/modules
          tar -czf nixconf-unstable.tar.gz -C pkg .

      - name: Create release
        run: |
          set -euo pipefail
          gh release create "${{ steps.meta.outputs.tag_name }}" \
            --title "${{ steps.meta.outputs.release_name }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            --prerelease \
            nixconf-unstable.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete previous unstable release
        if: steps.meta.outputs.prev_tag != ''
        run: |
          set -euo pipefail
          gh release delete "${{ steps.meta.outputs.prev_tag }}" --yes
        env:
          GH_TOKEN: ${{ github.token }}
